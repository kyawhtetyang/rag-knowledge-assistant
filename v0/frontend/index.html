<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG v0</title>
  <style>
    :root {
      --bg: #f2f5f0;
      --surface: #ffffff;
      --ink: #1f2933;
      --muted: #4b5563;
      --brand: #0f766e;
      --brand-2: #115e59;
      --line: #d1d5db;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 10% -10%, #d9f99d 0%, transparent 40%),
                  radial-gradient(circle at 90% 120%, #99f6e4 0%, transparent 45%),
                  var(--bg);
    }
    .wrap { max-width: 980px; margin: 36px auto; padding: 0 16px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { margin: 0 0 8px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 10px 0 6px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .result { white-space: pre-wrap; line-height: 1.4; }
    .citation {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #fcfffd;
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>RAG v0 Workspace</h1>
      <p>Ingest local docs, retrieve relevant chunks, and answer with citations.</p>
      <label for="apiBase">Backend API</label>
      <input id="apiBase" value="http://127.0.0.1:5002" />
      <div class="btns">
        <button id="initDbBtn">Init DB</button>
        <button id="ingestBtn">Ingest Default Docs</button>
      </div>
      <p id="ops" class="result"></p>
    </section>

    <section class="panel">
      <label for="question">Question</label>
      <textarea id="question" placeholder="Ask about indexed documents..."></textarea>
      <div class="row">
        <div>
          <label for="topK">Top K</label>
          <input id="topK" type="number" min="1" max="20" value="5" />
        </div>
        <div class="btns" style="align-items:end;">
          <button id="askBtn">Ask</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <label>Answer</label>
      <div id="answer" class="result">No answer yet.</div>
      <label style="margin-top:12px;">Citations</label>
      <div id="citations"></div>
    </section>
  </main>

  <script>
    const apiBaseEl = document.getElementById('apiBase');
    const initDbBtn = document.getElementById('initDbBtn');
    const ingestBtn = document.getElementById('ingestBtn');
    const askBtn = document.getElementById('askBtn');
    const opsEl = document.getElementById('ops');
    const answerEl = document.getElementById('answer');
    const citationsEl = document.getElementById('citations');

    const saved = localStorage.getItem('ragApiBase');
    if (saved) apiBaseEl.value = saved;

    function base() {
      const val = apiBaseEl.value.trim().replace(/\/$/, '');
      localStorage.setItem('ragApiBase', val);
      return val;
    }

    async function post(path, payload = {}) {
      const res = await fetch(`${base()}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    initDbBtn.onclick = async () => {
      try {
        opsEl.textContent = 'Initializing DB...';
        const data = await post('/api/init-db');
        opsEl.textContent = data.message || 'DB initialized';
      } catch (e) {
        opsEl.textContent = `Error: ${e.message}`;
      }
    };

    ingestBtn.onclick = async () => {
      try {
        opsEl.textContent = 'Ingesting default docs...';
        const data = await post('/api/ingest', {});
        opsEl.textContent = `Ingested docs=${data.ingested.documents}, chunks=${data.ingested.chunks}, total=${data.total_chunks}`;
      } catch (e) {
        opsEl.textContent = `Error: ${e.message}`;
      }
    };

    askBtn.onclick = async () => {
      const question = document.getElementById('question').value.trim();
      const topK = Number(document.getElementById('topK').value || 5);
      if (!question) return;

      askBtn.disabled = true;
      answerEl.textContent = 'Running retrieval + generation...';
      citationsEl.innerHTML = '';

      try {
        const data = await post('/api/ask', { question, top_k: topK });
        answerEl.textContent = data.answer || '(empty answer)';

        for (const c of data.citations || []) {
          const div = document.createElement('div');
          div.className = 'citation';
          div.innerHTML = `<strong>${c.source}</strong> | chunk ${c.chunk_index} | score ${c.score}<br>${c.preview}`;
          citationsEl.appendChild(div);
        }
      } catch (e) {
        answerEl.textContent = `Error: ${e.message}`;
      } finally {
        askBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
