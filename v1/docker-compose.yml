services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mini-ragflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-minirag}
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - mini_ragflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-minirag}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./backend
    container_name: mini-ragflow-api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8010"]
    ports:
      - "${API_HOST_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python3", "-m", "app.healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: mini-ragflow-worker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python3", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python3", "-m", "app.healthcheck", "worker"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

volumes:
  mini_ragflow_pgdata:
