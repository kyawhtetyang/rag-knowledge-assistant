<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Knowledge Assistant</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="topbar">
          <div>
            <h1>RAG Knowledge Assistant</h1>
            <p id="healthText">Checking service...</p>
          </div>
          <a class="docsLink" href="/docs">API Docs</a>
        </div>

        <div class="grid">
          <section class="card">
            <h2>Upload</h2>
            <form id="uploadForm">
              <input id="fileInput" name="file" type="file" accept=".txt,.md,.pdf,text/plain,application/pdf" required />
              <button type="submit">Upload</button>
            </form>
            <div id="jobStatus" class="statusBox">No job yet.</div>
          </section>

          <section class="card">
            <h2>Ask</h2>
            <form id="askForm">
              <textarea id="questionInput" rows="5" placeholder="Ask a question about the uploaded content..." required></textarea>
              <button type="submit">Ask</button>
            </form>
          </section>
        </div>

        <section class="answer">
          <h2>Indexed Documents</h2>
          <div id="documentList" class="documentList">Checking indexed documents...</div>
        </section>

        <section class="answer">
          <h2>Answer</h2>
          <div id="answerText" class="answerText">Upload a document, then ask a question.</div>
          <div id="citations" class="citations"></div>
        </section>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
